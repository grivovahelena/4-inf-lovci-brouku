<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovci brouků</title>
<style>
:root{
  --pozadi:#E3F2EA; --papir:#FFFFFF; --mrizka:#C7DCEF; --tmava:#1F3B2D; --text:#22303A; --text2:#56656F;
  --cervena:#D7263D; --jantar:#F4A259; --jantar2:#C77B33; --zelena:#2E8B57; --chyba:#C0392B;
  --vpred:#3B82C4; --vlevo:#E8833A; --vpravo:#8E5CC9; --linka:#CFE0D6; --cihla:#B5533C;
}
*{box-sizing:border-box}
html{font-size:18px;background:var(--pozadi)}
html.velke{font-size:21px}
body{margin:0;font-family:Verdana,"Segoe UI",system-ui,sans-serif;color:var(--text);line-height:1.45;min-height:100vh;
  background:var(--pozadi) radial-gradient(circle at 85% 0%,#f3fbf6 0,transparent 45%)}
button{font:inherit;cursor:pointer}
#app{max-width:980px;margin:0 auto;padding:12px 16px 40px}
h1,h2{font-family:Georgia,"Times New Roman",serif}
h1{font-size:2.2rem;text-align:center;margin:.2em 0;color:var(--tmava)}
.podtitul{text-align:center;color:var(--text2);margin:0 0 14px}
.horni{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.horni .nazev{flex:1;min-width:180px;font-weight:bold;color:var(--tmava)}
.tl{min-height:48px;padding:10px 18px;border-radius:14px;border:2px solid transparent;background:var(--jantar);color:var(--text);font-weight:bold;box-shadow:0 3px 0 var(--jantar2)}
.tl:active{transform:translateY(2px);box-shadow:none}
.tl:disabled{opacity:.45;cursor:default}
.tl.druhe{background:#fff;border-color:var(--linka);box-shadow:0 3px 0 var(--linka)}
.tl.maly{min-height:44px;padding:6px 12px;font-size:.9rem}
.karta{background:var(--papir);border-radius:20px;padding:18px;box-shadow:0 6px 18px rgba(30,60,45,.12);border:1px solid #d5e8dd}
.uvod-wrap{display:grid;grid-template-columns:190px 1fr;gap:18px;align-items:center}
@media (max-width:640px){.uvod-wrap{grid-template-columns:1fr}.uvod-wrap .postava{margin:0 auto;width:140px}}
.postava svg{width:100%;height:auto}
input[type=text]{font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--linka);width:100%;max-width:340px}
.odkazy a{display:block;padding:10px 12px;margin:6px 0;border-radius:12px;background:#eef7f1;color:var(--tmava);text-decoration:none;font-weight:bold}
.odkazy a span{display:block;font-weight:normal;font-size:.85rem;color:var(--text2)}
details summary{cursor:pointer;font-weight:bold;min-height:44px;display:flex;align-items:center}
.podpis{color:var(--text2);font-size:.8rem;text-align:center;margin-top:18px}
.zajimavost{background:#fff7e8;border-left:5px solid var(--jantar);border-radius:10px;padding:10px 14px;margin-top:10px}
/* sbírka */
.sbirka{width:100%;height:auto;display:block}
.mise-seznam{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.mise-karta{text-align:left;border:1px solid #d5e8dd;border-radius:18px;padding:14px;background:var(--papir);display:flex;gap:12px;align-items:center;min-height:84px;box-shadow:0 4px 0 var(--linka)}
.mise-karta .cislo{flex:0 0 46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--tmava);color:#fff;font-weight:bold;font-size:1.2rem}
.mise-karta.hotova .cislo{background:var(--jantar);color:var(--text)}
.mise-karta.zamcena{opacity:.55;cursor:default}
.mise-karta small{display:block;color:var(--text2)}
.hvezdy{color:#D49B00;letter-spacing:2px}
.banner{margin-top:14px;background:var(--jantar);border-radius:18px;padding:14px;text-align:center;font-weight:bold}
/* mise */
.tecky{display:flex;gap:6px;flex-wrap:wrap}
.tecka{width:14px;height:14px;border-radius:50%;background:#bcd6c6}
.tecka.hotovo{background:var(--tmava)}
.tecka.ted{outline:3px solid var(--jantar)}
.zadani{font-size:1.15rem;font-weight:bold;margin:0 0 10px}
.pravidla{font-size:.85rem;background:#eef7f1;border-radius:12px;padding:8px 12px;color:var(--text2);margin-bottom:12px}
.uloha-layout{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:18px;align-items:start}
@media (max-width:760px){.uloha-layout{grid-template-columns:1fr}}
.ramecek{background:#fff;padding:8px;border-radius:14px;border:2px solid var(--mrizka);max-width:440px;margin:0 auto;width:100%;box-shadow:3px 3px 0 #d9e7f3}
.mrizka{--r:5;--c:5;position:relative;width:100%;aspect-ratio:var(--c)/var(--r);display:grid;grid-template-columns:repeat(var(--c),1fr);grid-template-rows:repeat(var(--r),1fr);
  background-color:#fff;background-image:linear-gradient(var(--mrizka) 1px,transparent 1px),linear-gradient(90deg,var(--mrizka) 1px,transparent 1px);background-size:20px 20px;border-radius:6px;overflow:hidden}
.bunka{position:relative;box-shadow:inset 0 0 0 1px #8fb3d4;display:grid;place-items:center;background:rgba(255,255,255,.55)}
.bunka.klik{cursor:pointer}
.bunka.klik:hover{background:rgba(244,162,89,.22)}
.bunka.vybrana{background:rgba(244,162,89,.4);box-shadow:inset 0 0 0 3px var(--jantar)}
.bunka.spravna{background:rgba(46,139,87,.3);box-shadow:inset 0 0 0 3px var(--zelena)}
.bunka.spatna{background:rgba(215,38,61,.35);box-shadow:inset 0 0 0 4px var(--cervena)}
.bunka.spatna::after{content:'✗';color:var(--cervena);font-size:1.6rem;font-weight:bold;position:absolute}
.bunka.zed{background:var(--cihla);background-image:linear-gradient(#8f3d2a 2px,transparent 2px),linear-gradient(90deg,#8f3d2a 2px,transparent 2px);background-size:100% 33.3%,50% 33.3%;box-shadow:inset 0 0 0 2px #7a3322}
.bunka .zed-t{color:#fff;font-size:.55rem;font-weight:bold;letter-spacing:.5px;text-shadow:0 1px 1px #000}
.bunka .cil{font-size:2rem;color:#E0A800;line-height:1}
.bunka .start{position:absolute;bottom:2px;left:4px;font-size:.55rem;color:var(--text2);font-weight:bold}
.bunka .blesk{position:absolute;top:0;right:2px;font-size:1.3rem;z-index:4}
.cary{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.cary line{stroke-linecap:round;stroke-width:.08}
.robot{position:absolute;left:0;top:0;width:calc(100% / var(--c));height:calc(100% / var(--r));transform:translate(calc(var(--zc) * 100%),calc(var(--zr) * 100%));transition:transform .38s ease-in-out;display:grid;place-items:center;pointer-events:none;z-index:3}
.robot-telo{width:78%;height:78%;transition:transform .38s ease-in-out}
.robot-telo svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
@media (prefers-reduced-motion:reduce){.robot,.robot-telo{transition:none!important}}
.radek-programu{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.cmd{position:relative;width:52px;height:56px;border-radius:12px;border:3px solid transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.4rem;font-weight:bold;line-height:1;padding:0}
.cmd small{font-size:.55rem;font-weight:bold;margin-top:2px}
.cmd i{position:absolute;top:1px;right:4px;font-size:.6rem;font-style:normal;opacity:.95}
.cmd.v{background:var(--vpred)}.cmd.l{background:var(--vlevo)}.cmd.p{background:var(--vpravo)}
.cmd.akt{outline:4px solid #FFD54F;transform:scale(1.1)}
.cmd.prosel{opacity:.6}
.cmd.bum{outline:4px solid var(--cervena)}
.cmd.klik{cursor:pointer}
.cmd.klik:hover{outline:3px solid var(--jantar)}
.cmd.vybrany{outline:4px solid var(--jantar);transform:translateY(-4px)}
.cmd.ztlumeny{opacity:.3}
.cmd.po-n{outline:4px solid var(--jantar)}
.cmd.zmeneny{border-color:#fff;box-shadow:0 0 0 3px var(--zelena)}
.cmd .znacka{position:absolute;top:-14px;left:-10px;font-size:1.25rem;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.moznosti{display:grid;gap:10px;margin-top:6px}
.moznost{text-align:left;min-height:56px;padding:12px 14px;border-radius:14px;border:3px solid var(--linka);background:#fff;font-size:1rem}
.moznost:hover{border-color:var(--jantar)}
.moznost.spravne{border-color:var(--zelena);background:#e3f6ea}
.moznost.spatne{border-color:var(--chyba);background:#fbe3e0}
.moznost:disabled{cursor:default}
.smery{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:10px;margin-top:8px}
.smer-tl{min-height:58px;border-radius:14px;border:3px solid var(--linka);background:#fff;font-size:1rem;font-weight:bold;display:flex;align-items:center;gap:8px;justify-content:center}
.smer-tl b{font-size:1.6rem}
.smer-tl.vybrany{border-color:var(--jantar);background:#fff3e3}
.smer-tl.spatne{border-color:var(--chyba);background:#fbe3e0}
.smer-tl.spravne{border-color:var(--zelena);background:#e3f6ea}
.ovladani{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.nahrada{background:#fff7e8;border:2px dashed var(--jantar);border-radius:14px;padding:10px;margin-top:8px}
.nahrada .pad{display:flex;gap:10px;margin-top:6px}
.nahrada .cmd{width:70px;height:64px;font-size:1.8rem}
.nahrada .cmd:disabled{opacity:.3;cursor:default}
.krok-ladeni{font-size:.9rem;color:var(--text2);margin:4px 0}
.krok-ladeni b{color:var(--tmava)}
.zpetna{margin-top:14px;border-radius:16px;padding:12px 14px;display:none;gap:12px;align-items:flex-start}
.zpetna.ukaz{display:flex}
.zpetna.ok{background:#e3f6ea;border:2px solid #9fd1b2}
.zpetna.rada{background:#fff3cf;border:2px solid #f0cf7a}
.zpetna.info{background:#eef4fb;border:2px solid #b5cde6}
.zpetna.reseni{background:#eef0f6;border:2px solid #b8c0d8}
.zpetna .avatar{flex:0 0 52px}
.zpetna p{margin:.2em 0}
.zpetna .tl{margin-top:8px}
.otresy{animation:otres .35s}
@keyframes otres{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.odmena{text-align:center}
.odmena .hvezdy{font-size:2.4rem}
/* diplom */
.diplom{background:#fff;border:10px solid var(--tmava);outline:3px dashed var(--jantar);outline-offset:-20px;border-radius:12px;padding:34px;text-align:center;max-width:860px;margin:0 auto}
.diplom h2{font-size:2.3rem;color:var(--tmava);margin:.1em 0}
.diplom .jmeno{font-family:Georgia,serif;font-size:2.4rem;color:var(--cervena);margin:10px 0;border-bottom:2px solid var(--linka);display:inline-block;padding:0 30px}
.diplom .brouci{display:flex;justify-content:center;gap:10px;margin:8px 0}
.diplom .brouci svg{width:54px;height:54px}
.diplom .podpisy{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;gap:20px}
.diplom .podpisy div{flex:1}
.diplom .cara{border-top:2px solid var(--text);padding-top:4px;font-size:.9rem}
@media print{
  @page{size:A4 landscape;margin:12mm}
  html,body{background:#fff}
  .neprint{display:none!important}
  #app{padding:0;max-width:none}
  .diplom{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.skryte{display:none!important}
</style>
</head>
<body>
<main id="app"></main>

<script>
// =====================================================================
// ===== DATA HRY: zde učitel upravuje obsah ===========================
// =====================================================================
// Mřížka: radky × sloupce. Políčka se píšou jako [řádek, sloupec],
// počítá se od 0 zleva nahoře. zdi = seznam políček se zdí.
// Směr robota: "nahoru", "doprava", "dolu", "doleva".
// Příkazy: ↑ = krok vpřed, ↶ = otoč vlevo, ↷ = otoč vpravo (bez mezer).
// U chybných programů hra sama spočítá, kde sedí brouk (příkaz, jehož
// výměnou program dojde do cíle) a kde se chyba projevila.
// Hra hlídá, aby šel každý chybný program opravit právě jedním příkazem.
// =====================================================================
const HRA = {
  nazev: "Lovci brouků",
  podtitul: "Informatika • 4. třída • Robot hledá chybu",
  klic: "inf-lovci-brouku-4-v1",
  autor: "Mgr. Helena Gřivová",
  uvod: "Ahoj, jsem Ťuk, lovec brouků. V mých programech se schovávají brouci, tedy chyby. Brouk se ale schovává chytře: nesedí tam, kde jsem narazil, ale tam, kde chyba vznikla. Pomůžeš mi je pochytat?",
  pravidla: "↑ krok vpřed = 1 pole tam, kam se robot dívá • ↶ ↷ otočení na místě • příkazy čteme zleva doprava • přes zeď ani mimo mřížku robot nesmí",
  odkazy: [
    {nazev: "🧩 Procvičování: Posloupnosti příkazů", popis: "Umíme informatiku, 4. třída", url: "https://www.umimeinformatiku.cz/cviceni-algoritmicke-mysleni-zaklady-4-trida"},
    {nazev: "🎬 Video: Jedou algoritmy ve správném rytmu?", popis: "ČT edu, 2 min 33 s (opakování)", url: "https://edu.ceskatelevize.cz/video/18170-digitalni-svet-jedou-algoritmy-ve-spravnem-rytmu"}
  ],
  pochvaly: ["Výborně!", "Brouk je chycený!", "Přesně tak!", "Skvělá práce!", "Ťuk děkuje!", "Jsi pravý lovec brouků!", "Správně!"],
  zaver: "Všech pět brouků je ve sbírce! Umíš program provést, najít chybu, opravit ji a znovu ověřit.",
  diplom: {
    nadpis: "Diplom",
    titul: "Mistr ladění, lovec brouků",
    text: "pochytal(a) všechny brouky v programech robota Ťuka. Umí program provést krok po kroku, najít příkaz, který chybu způsobil, opravit ho a celý program znovu ověřit."
  },

  mise: [
    { id: "m1", nazev: "Krok po kroku", brouk: "slunecko", typ: "poN",
      uvod: "Lovec brouků musí umět sledovat robota po každém příkazu. Kde budu stát a kam se budu dívat?",
      zaverMise: "Po každém příkazu kontrolujeme polohu i směr. Bez toho bychom brouka nikdy nenašli.",
      ulohy: [
        {radky: 4, sloupce: 4, start: [3,0], smer: "nahoru", zdi: [], program: "↑↑↑↷↑↑↑", po: 4},
        {radky: 5, sloupce: 5, start: [4,0], smer: "nahoru", zdi: [[3,2]], program: "↑↑↷↑↑↑", po: 3},
        {radky: 4, sloupce: 5, start: [3,0], smer: "nahoru", zdi: [[1,0],[1,1],[1,2]], cil: [0,3], program: "↑↷↑↑↑↶↑↑", po: 5, poznamka: "Tuhle mřížku znáš z pracovního listu!"},
        {radky: 4, sloupce: 5, start: [3,0], smer: "nahoru", zdi: [[1,0],[1,1],[1,2]], cil: [0,3], program: "↑↷↑↑↑↷↑↑", po: 6, poznamka: "Program z pracovního listu, část D."},
        {radky: 5, sloupce: 5, start: [4,4], smer: "nahoru", zdi: [[2,2],[1,3]], program: "↶↑↑↑↑↷↑↑↑↑", po: 6},
        {radky: 5, sloupce: 5, start: [4,0], smer: "nahoru", zdi: [[2,1],[1,3],[3,3],[4,2]], program: "↑↑↑↑↷↑↑↑↑↷↑↑↑↑", po: 10}
      ]
    },

    { id: "m2", nazev: "Projev, nebo příčina?", brouk: "chroust", typ: "kviz",
      uvod: "Než vyrazíme na lov, musíš vědět, jak brouci vznikají a jak se hledají.",
      zajimavost: "Víš, proč se chybám v programech říká brouci? V roce 1947 našli technici v obřím počítači Mark II opravdovou můru, která způsobila poruchu. Nalepili ji do deníku. Chybám se anglicky dodnes říká „bug“, tedy brouk, a hledání chyb je „debugging“, česky ladění.",
      zaverMise: "Místo, kde se chyba projeví, nemusí být místem, kde chyba vznikla. Při ladění nehádáme, ale kontrolujeme program krok po kroku.",
      ulohy: [
        {zadani: "Robot vyjel z mřížky při 8. příkazu. Musí být chybný 8. příkaz?", moznosti: ["Ne, chyba mohla vzniknout dřív.", "Ano, vždycky.", "Chyba je vždycky v 1. příkazu."], spravne: 0,
         napoveda: "Vzpomeň si: robot se může otočit špatně, ale narazí až o pár kroků později.",
         vysvetleni: "Chyba se mohla stát dřív. Například špatné otočení se projeví až při dalších krocích."},
        {zadani: "Co je ladění programu?", moznosti: ["Hledání a opravování chyb v programu.", "Náhodné měnění příkazů.", "Psaní úplně nového programu."], spravne: 0,
         napoveda: "Ladit znamená program zlepšovat, dokud nefunguje. Ale ne náhodně.",
         vysvetleni: "Ladění je hledání a opravování chyb v programu."},
        {zadani: "Program nefunguje. Co uděláš nejdřív?", moznosti: ["Provedu ho od STARTU po jednom příkazu.", "Smažu celý program.", "Změním poslední příkaz."], spravne: 0,
         napoveda: "Lovec brouků nehádá. Nejdřív sleduje, co robot opravdu dělá.",
         vysvetleni: "Nejdřív program provedeme od STARTU po jednom příkazu a sledujeme robota."},
        {zadani: "Robot se otočil špatně, ale stojí na správném políčku. Kdy se chyba projeví?", moznosti: ["Až při dalším kroku vpřed.", "Hned při otočení.", "Nikdy."], spravne: 0,
         napoveda: "Při otočení robot zůstává na místě. Kdy půjde špatným směrem?",
         vysvetleni: "Otočením se robot nepohne. Chyba se projeví až ve chvíli, kdy vykročí špatným směrem."},
        {zadani: "Proč příkazy v programu číslujeme?", moznosti: ["Abychom přesně řekli, který příkaz je chybný.", "Aby byl program delší.", "Protože to robot potřebuje."], spravne: 0,
         napoveda: "Představ si, že kamarádovi říkáš, kde je chyba.",
         vysvetleni: "Díky číslům můžeme říct přesně: chybný je 6. příkaz."},
        {zadani: "V programu je chybný jen jeden příkaz. Co opravíme?", moznosti: ["Jen ten jeden příkaz.", "Všechny příkazy.", "Všechny příkazy od něj do konce."], spravne: 0,
         napoveda: "Dobrý lovec chytí jen toho brouka, který tam opravdu je.",
         vysvetleni: "Opravíme jen chybný příkaz. Ostatní jsou v pořádku."},
        {zadani: "Kdy víš, že oprava opravdu funguje?", moznosti: ["Až když celý program znovu provedu od STARTU.", "Hned po opravě.", "Když to tak vypadá."], spravne: 0,
         napoveda: "Oprava musí projít zkouškou.",
         vysvetleni: "Teprve když opravený program znovu provedeme od STARTU a robot dojde do cíle, máme důkaz."},
        {zadani: "Jaké je správné pořadí ladění?", moznosti: ["provedu → najdu chybu → opravím → znovu ověřím", "opravím → provedu → najdu chybu → ověřím", "najdu chybu → ověřím → provedu → opravím"], spravne: 0,
         napoveda: "Nejdřív musíš vidět, co robot dělá. Ověření je až na konci.",
         vysvetleni: "Provedu program, najdu chybu, opravím příkaz a celý program znovu ověřím."}
      ]
    },

    { id: "m3", nazev: "Kde sedí brouk?", brouk: "rohac", typ: "brouk",
      uvod: "Spusť chybný program a sleduj, kde narazím. Pak najdi příkaz, kde opravdu sedí brouk. Pozor, nemusí to být tam, kde jsem narazil!",
      zaverMise: "Brouk sedí u příkazu, který chybu způsobil. Místo nárazu je jen projev chyby.",
      ulohy: [
        {radky: 4, sloupce: 4, start: [3,0], smer: "nahoru", cil: [0,3], zdi: [], program: "↑↑↑↶↑↑↑"},

const SMERY = ['nahoru','doprava','dolu','doleva'];
const VEKTOR = {nahoru:[-1,0], doprava:[0,1], dolu:[1,0], doleva:[0,-1]};
const SLOVO = {nahoru:'nahoru', doprava:'doprava', dolu:'dolů', doleva:'doleva'};
const SIPKA = {nahoru:'⬆', doprava:'➡', dolu:'⬇', doleva:'⬅'};
const PRIKAZ = {'↑':{tr:'v', slovo:'vpřed', cele:'krok vpřed'}, '↶':{tr:'l', slovo:'vlevo', cele:'otoč vlevo'}, '↷':{tr:'p', slovo:'vpravo', cele:'otoč vpravo'}};
const NAZVY_BROUKU = {slunecko:'Slunéčko sedmitečné', chroust:'Chroust obecný', rohac:'Roháč obecný', zlatohlavek:'Zlatohlávek zlatý', strevlik:'Střevlík fialový'};
const RYCHLOST = 420;
let zaneprazdneno = false;

const prikazy = s => [...s].filter(ch => PRIKAZ[ch]);
const stejne = (a,b) => a && b && a[0]===b[0] && a[1]===b[1];
const otoc = (smer, ch) => SMERY[(SMERY.indexOf(smer) + (ch==='↷'?1:3)) % 4];
const jeZed = (u,r,c) => (u.zdi||[]).some(z=>z[0]===r && z[1]===c);
const tvarPrikazu = n => `${n} ${n===1?'příkaz':n<5?'příkazy':'příkazů'}`;
function simuluj(u, program, doKolika){
  let [r,c] = u.start, smer = u.smer; const p = prikazy(program).slice(0, doKolika ?? 999);
  for (let i=0;i<p.length;i++){
    if (p[i]!=='↑'){ smer = otoc(smer,p[i]); continue; }
    const v = VEKTOR[smer], nr=r+v[0], nc=c+v[1];
    if (nr<0||nr>=u.radky||nc<0||nc>=u.sloupce) return {konec:[r,c], smer, stop:i, proc:'okraj'};
    if (jeZed(u,nr,nc)) return {konec:[r,c], smer, stop:i, proc:'zed'};
    r=nr; c=nc;
  }
  return {konec:[r,c], smer, stop:-1};
}
function dojde(u, p){ const s=simuluj(u,p); return s.stop<0 && stejne(s.konec,u.cil); }
function mozneOpravy(u, program){
  const p = prikazy(program), vys = [];
  p.forEach((ch,i) => ['↑','↶','↷'].forEach(n => { if (n!==ch){ const q=[...p]; q[i]=n; if (dojde(u,q.join(''))) vys.push({i, ch:n}); } }));
  return vys;
}
function odpoved(m, u){
  if (m.typ==='kviz') return u.spravne;
  if (m.typ==='poN'){ const s=simuluj(u,u.program,u.po); return {pole:s.konec, smer:s.smer}; }
  const o = mozneOpravy(u,u.program)[0], s = simuluj(u,u.program);
  return {brouk:o.i, nahrada:o.ch, projev:s.stop, proc:s.proc, konec:s.konec};
}
function zkontrolujData(){
  const chyby = [];
  HRA.mise.forEach(m => m.ulohy.forEach((u,i) => {
    const k = `${m.nazev}, úloha ${i+1}`;
    if (m.typ==='kviz'){ if (!(u.spravne>=0 && u.spravne<u.moznosti.length)) chyby.push(k+': index správné odpovědi'); return; }
    if (!SMERY.includes(u.smer)) chyby.push(k+': neznámý směr');
    if (jeZed(u,...u.start)) chyby.push(k+': start je ve zdi');
    if (m.typ==='poN'){ if (simuluj(u,u.program,u.po).stop>=0) chyby.push(k+': robot narazí před '+u.po+'. příkazem'); return; }
    if (dojde(u,u.program)) chyby.push(k+': chybný program ve skutečnosti dojde');
    if (mozneOpravy(u,u.program).length!==1) chyby.push(k+': program nejde opravit právě jedním příkazem');
  }));
  if (chyby.length) console.warn('Kontrola dat:', chyby); else console.log('Kontrola dat: vše v pořádku');
  return chyby;
}

function vytvorMrizku(u, opts={}){
  const R=u.radky, C=u.sloupce;
  const obal = document.createElement('div'); obal.className='ramecek';
  const el = document.createElement('div'); el.className='mrizka'; el.style.setProperty('--r',R); el.style.setProperty('--c',C); obal.appendChild(el);
  for (let r=0;r<R;r++) for (let c=0;c<C;c++){
    const b = document.createElement('div'); b.className='bunka'; b.dataset.r=r; b.dataset.c=c;
    if (jeZed(u,r,c)){ b.classList.add('zed'); b.innerHTML='<span class="zed-t">ZEĎ</span>'; }
    else {
      if (u.cil && stejne(u.cil,[r,c])) b.innerHTML = '<span class="cil" aria-label="cíl">★</span>';
      if (stejne(u.start,[r,c])) b.insertAdjacentHTML('beforeend','<span class="start">START</span>');
      if (opts.klik){ b.classList.add('klik'); b.setAttribute('role','button'); b.setAttribute('aria-label',`políčko ${r+1}. řádek, ${c+1}. sloupec`); }
    }
    el.appendChild(b);
  }
  const cary = document.createElementNS('http://www.w3.org/2000/svg','svg');
  cary.setAttribute('class','cary'); cary.setAttribute('viewBox',`0 0 ${C} ${R}`); cary.setAttribute('preserveAspectRatio','none'); el.appendChild(cary);
  const robot = document.createElement('div'); robot.className='robot'; robot.innerHTML = `<div class="robot-telo">${robotSVG()}</div>`; el.appendChild(robot);
  const telo = robot.firstChild;
  const g = {
    el: obal, mrizka: el, u, pos:[...u.start], smer:u.smer, uhel:SMERY.indexOf(u.smer)*90, barva:'#56656F',
    bunka:(r,c) => el.querySelector(`.bunka[data-r="${r}"][data-c="${c}"]`),
    postav(r,c){ this.pos=[r,c]; robot.style.setProperty('--zr',r); robot.style.setProperty('--zc',c); },
    natoc(){ telo.style.transform = `rotate(${this.uhel}deg)`; },
    resetRobota(){ cary.innerHTML=''; el.querySelectorAll('.blesk').forEach(x=>x.remove()); this.smer=u.smer; this.uhel=SMERY.indexOf(u.smer)*90; this.natoc(); this.postav(...u.start); },
    reset(){ this.resetRobota(); el.querySelectorAll('.bunka').forEach(b=>b.classList.remove('vybrana','spravna','spatna')); },
    cara(a,b){ const l=document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',a[1]+.5); l.setAttribute('y1',a[0]+.5); l.setAttribute('x2',b[1]+.5); l.setAttribute('y2',b[0]+.5); l.setAttribute('stroke',this.barva); cary.appendChild(l); },
    blesk(r,c){ const s=document.createElement('span'); s.className='blesk'; s.textContent='⚡'; this.bunka(r,c).appendChild(s); }
  };
  g.reset();
  return g;
}

  prikazy(program).forEach((ch,i) => {
    const b = document.createElement(opts.klik?'button':'div'); b.className='cmd '+PRIKAZ[ch].tr+(opts.klik?' klik':''); b.dataset.i=i;
    b.innerHTML = `${ch}<small>${PRIKAZ[ch].slovo}</small><i>${i+1}</i>`; b.setAttribute('aria-label',`${i+1}. příkaz: ${PRIKAZ[ch].cele}`);
    row.appendChild(b);
  });
  return row;
}
function nastavChip(chip, ch){ const i=chip.dataset.i; chip.className=chip.className.replace(/\b[vlp]\b/,PRIKAZ[ch].tr); chip.innerHTML=`${ch}<small>${PRIKAZ[ch].slovo}</small><i>${+i+1}</i>`; }
function znacka(chip, z){ chip.querySelectorAll('.znacka').forEach(x=>x.remove()); if(z) chip.insertAdjacentHTML('beforeend',`<span class="znacka">${z}</span>`); }
async function krok(g, ch, chip){
  if (chip) chip.classList.add('akt');
  let ok = true;
  if (ch==='↑'){
    const v=VEKTOR[g.smer], nr=g.pos[0]+v[0], nc=g.pos[1]+v[1];
    if (nr<0||nr>=g.u.radky||nc<0||nc>=g.u.sloupce||jeZed(g.u,nr,nc)){
      const [r,c]=g.pos; g.postav(r+v[0]*0.3,c+v[1]*0.3); await cekej(RYCHLOST*0.6); g.postav(r,c); await cekej(RYCHLOST*0.4);
      g.mrizka.classList.add('otresy'); setTimeout(()=>g.mrizka.classList.remove('otresy'),400); g.blesk(r,c); ok=false;
    } else { const od=[...g.pos]; g.postav(nr,nc); await cekej(RYCHLOST); g.cara(od,[nr,nc]); }
  } else { g.uhel += ch==='↷'?90:-90; g.smer=otoc(g.smer,ch); g.natoc(); await cekej(RYCHLOST); }
  if (chip){ chip.classList.remove('akt'); chip.classList.add(ok?'prosel':'bum'); }
  return ok;
}
async function prehraj(g, program, radek, doKolika, barva){
  zaneprazdneno = true; g.resetRobota(); g.barva = barva || '#56656F';
  const chips = radek ? radek.querySelectorAll('.cmd') : [];
  chips.forEach(c=>c.classList.remove('akt','prosel','bum'));
  const p = prikazy(program).slice(0, doKolika ?? 999); let ok = true;
  for (let i=0;i<p.length;i++){ if (!(await krok(g,p[i],chips[i]))){ ok=false; break; } }
  zaneprazdneno = false; return ok;
}
function krokovani(g, ziskejProgram, radek, kontejner){
  const box = document.createElement('div'); box.className='ovladani skryte';
  box.innerHTML = `<button class="tl druhe maly">Krok ▶</button><button class="tl druhe maly">Znovu od startu ⟲</button>`;
  kontejner.appendChild(box);
  const [tk, tz] = box.querySelectorAll('button'); let i = 0;
  const vrat = () => { g.resetRobota(); i=0; radek.querySelectorAll('.cmd').forEach(c=>c.classList.remove('akt','prosel','bum')); tk.disabled=false; };
  tz.onclick = () => { if(!zaneprazdneno) vrat(); };
  tk.onclick = async () => { const p=prikazy(ziskejProgram()); if (zaneprazdneno||i>=p.length) return; if(i===0){ g.resetRobota(); g.barva='#56656F'; }
    zaneprazdneno=true; const ok=await krok(g,p[i],radek.querySelectorAll('.cmd')[i]); zaneprazdneno=false; i++; if(!ok||i>=p.length) tk.disabled=true; };
  return { ukaz(){ box.classList.remove('skryte'); }, skryj(){ box.classList.add('skryte'); }, vrat };
}
function smerTlacitka(box){
  SMERY.forEach(s => { const b=document.createElement('button'); b.className='smer-tl'; b.dataset.s=s; b.innerHTML=`<b>${SIPKA[s]}</b>${SLOVO[s]}`; b.setAttribute('aria-label','dívá se '+SLOVO[s]); box.appendChild(b); });
  return box.querySelectorAll('.smer-tl');
}

// ---------- obrazovky ----------
function uvod(){
  const hotovo = Object.keys(S.hotovo).length;
  $app.innerHTML = `<h1>🔍 ${esc(HRA.nazev)}</h1><p class="podtitul">${esc(HRA.podtitul)}</p>
  <div class="karta"><div class="uvod-wrap"><div class="postava">${robotSVG()}</div><div>
    <p style="font-size:1.1rem">${esc(HRA.uvod)}</p>
    ${S.jmeno ? `<p><b>Vítej zpět, ${esc(S.jmeno)}!</b> ${hotovo?`Ve sbírce máš ${hotovo} z ${HRA.mise.length} brouků.`:''}</p>
      <div class="ovladani"><button class="tl" id="pokracuj">Pokračovat ▶</button><button class="tl druhe" id="znovu">Začít znovu</button></div>`
    : `<label for="jmeno"><b>Jak se jmenuješ?</b></label><br><input type="text" id="jmeno" maxlength="30" autocomplete="off" placeholder="Tvoje jméno">
      <div class="ovladani"><button class="tl" id="start">Vyrazit na lov ▶</button></div>`}
  </div></div>
  <details style="margin-top:14px"><summary>📺 Než začneš: procvičování a video</summary><div class="odkazy">
    ${HRA.odkazy.map(o=>`<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.nazev)}<span>${esc(o.popis)}</span></a>`).join('')}</div></details>
  </div><p class="podpis">${esc(HRA.autor)} (vytvořeno pomocí AI)</p>`;
  const start = document.getElementById('start');
  if (start){
    const inp = document.getElementById('jmeno');
    const jdi = () => { const j=inp.value.trim(); if(!j){ inp.focus(); inp.style.borderColor='var(--chyba)'; return; } S.jmeno=j; uloz(); sbirka(); };
    start.onclick = jdi; inp.onkeydown = e => { if(e.key==='Enter') jdi(); };
  } else {
    document.getElementById('pokracuj').onclick = sbirka;
    document.getElementById('znovu').onclick = () => { if (confirm('Opravdu začít znovu? Smaže se jméno i celá sbírka.')){ const v=S.velke; S=novyStav(); S.velke=v; uloz(); uvod(); } };
  }
}
const odemcena = i => i===0 || !!S.hotovo[HRA.mise[i-1].id];
function sbirka(){
  const vse = HRA.mise.every(m=>S.hotovo[m.id]);
  $app.innerHTML = hlavicka(`Sbírka • ${esc(S.jmeno)}`) + sbirkaSVG() +
    (vse ? `<div class="banner">🎉 ${esc(HRA.zaver)}<div class="ovladani" style="justify-content:center"><button class="tl druhe" id="diplom">🎓 Získat diplom</button></div></div>` : '') +
    `<div class="mise-seznam">${HRA.mise.map((m,i)=>{ const h=S.hotovo[m.id], ok=odemcena(i);
      return `<button class="mise-karta ${h?'hotova':''} ${ok?'':'zamcena'}" data-i="${i}" ${ok?'':'aria-disabled="true"'}>
        <div class="cislo">${ok?(i+1):'🔒'}</div><div><b>${esc(m.nazev)}</b><small>${m.ulohy.length} úloh</small>${h?`<span class="hvezdy">${hvezdy(h.hvezdy)}</span>`:''}</div></button>`; }).join('')}</div>`;
  navazHlavicku();
  $app.querySelectorAll('.mise-karta').forEach(b => b.onclick = () => { const i=+b.dataset.i; if(odemcena(i)) otevriMisi(i); });
  const d = document.getElementById('diplom'); if (d) d.onclick = diplom;
}
function otevriMisi(mi){
  const m = HRA.mise[mi]; let p = S.pozice[m.id];
  if (!p || p.i>=m.ulohy.length) p = S.pozice[m.id] = {i:0, ok:0};
  if (p.i===0){
    $app.innerHTML = hlavicka(esc(m.nazev)) + `<div class="karta"><div class="uvod-wrap"><div class="postava">${robotSVG()}</div>
      <div><h2>${mi+1}. ${esc(m.nazev)}</h2><p style="font-size:1.1rem">${esc(m.uvod)}</p>${m.zajimavost?`<div class="zajimavost">🦋 <b>Zajímavost:</b> ${esc(m.zajimavost)}</div>`:''}
      <div class="ovladani"><button class="tl" id="jdi">Začít ▶</button></div></div></div></div>`;
    navazHlavicku(); document.getElementById('jdi').onclick = () => uloha(mi);
  } else uloha(mi);
}
function uloha(mi){
  const m = HRA.mise[mi], p = S.pozice[m.id], u = m.ulohy[p.i];
  $app.innerHTML = hlavicka(`${mi+1}. ${esc(m.nazev)}`) +
    `<div class="tecky neprint" style="margin-bottom:10px">${m.ulohy.map((_,j)=>`<span class="tecka ${j<p.i?'hotovo':''} ${j===p.i?'ted':''}"></span>`).join('')}</div>
    <div class="karta"><div id="obsah"></div><div class="zpetna" id="zpetna" aria-live="polite"><div class="avatar">${robotSVG()}</div>
    <div><div id="zpetna-text"></div><button class="tl skryte" id="dalsi">Další ▶</button></div></div></div>`;
  navazHlavicku();
  let chyba = false;
  const ctx = { m, u, obsah: document.getElementById('obsah'),
    zprava(druh, html){ const z=document.getElementById('zpetna'); z.className='zpetna ukaz '+druh; document.getElementById('zpetna-text').innerHTML=html; },
    chyba(){ chyba = true; },
    hotovo(html){ ctx.zprava(chyba?'reseni':'ok', html); const b=document.getElementById('dalsi'); b.classList.remove('skryte'); b.focus({preventScroll:true});
      b.onclick = () => { if(zaneprazdneno) return; if(!chyba) p.ok++; p.i++; uloz(); p.i>=m.ulohy.length ? dokonciMisi(mi) : uloha(mi); }; }
  };
  ({kviz:ulohaKviz, poN:ulohaPoN, brouk:ulohaBrouk, oprava:ulohaOprava, lov:ulohaOprava})[m.typ](ctx);
}
const pochvala = () => `<p><b>${nahodne(HRA.pochvaly)}</b></p>`;
const pravidlaHTML = () => `<div class="pravidla">${esc(HRA.pravidla)}</div>`;
function popisProjevu(a){ return a.projev>=0 ? `Robot narazil ${a.proc==='zed'?'do zdi':'na okraj mřížky'} při <b>${a.projev+1}. příkazu</b>.` : 'Robot nenarazil, ale skončil jinde než ve hvězdičce.'; }
function popisBrouka(u,a){ const p=prikazy(u.program); return `Brouk seděl u <b>${a.brouk+1}. příkazu</b>: místo „${PRIKAZ[p[a.brouk]].cele}“ tam patří „${PRIKAZ[a.nahrada].cele}“.`; }
function radaKeKliku(i, a){
  if (i===a.projev && a.projev!==a.brouk) return 'Tady se chyba jen <b>projevila</b>, protože tady robot narazil. Vrať se zpátky: kdy se robot poprvé otočil nebo vykročil jinak, než je potřeba k hvězdičce?';
  if (i<a.brouk) return `Až po ${i+1}. příkaz robot jde správně. Brouk sedí dál.`;
  return 'Brouk sedí dřív. Vrať se zpátky a sleduj robota po jednom příkazu.';
}

// --- kvíz ---
function ulohaKviz(ctx){
  const {u, obsah} = ctx; let pokusy = 0;
  obsah.innerHTML = `<p class="zadani">${esc(u.zadani)}</p><div class="moznosti"></div>`;
  const box = obsah.querySelector('.moznosti');
  zamichej(u.moznosti.map((t,i)=>({t,i}))).forEach(({t,i}) => {
    const b = document.createElement('button'); b.className='moznost'; b.textContent=t; b.dataset.i=i;
    b.onclick = () => {
      if (i===u.spravne){ b.classList.add('spravne'); box.querySelectorAll('button').forEach(x=>x.disabled=true); ctx.hotovo(pochvala()+`<p>${esc(u.vysvetleni)}</p>`); return; }
      pokusy++; ctx.chyba(); b.classList.add('spatne'); b.disabled=true;
      if (pokusy===1) ctx.zprava('rada', `<p><b>Ještě jednou.</b> ${esc(u.napoveda)}</p>`);
      else { box.querySelectorAll('button').forEach(x=>{ x.disabled=true; if(+x.dataset.i===u.spravne) x.classList.add('spravne'); });
        ctx.hotovo(`<p><b>Správná odpověď je označená zeleně.</b></p><p>${esc(u.vysvetleni)}</p>`); }
    };
    box.appendChild(b);
  });
}

// --- krok po kroku: kde stojí po N. příkazu ---
function ulohaPoN(ctx){
  const {m, u, obsah} = ctx; const sp = odpoved(m,u); let pokusy=0, pole=null, smer=null, hotovo=false;
  obsah.innerHTML = `<p class="zadani">Kde robot stojí a kam se dívá <u>po ${u.po}. příkazu</u>?</p>${u.poznamka?`<p>📄 ${esc(u.poznamka)}</p>`:''}${pravidlaHTML()}
    <div class="uloha-layout"><div id="m"></div><div><b>Program:</b><div id="r"></div>
    <p style="margin:6px 0 0"><b>1.</b> Klepni na políčko, kde robot stojí po ${u.po}. příkazu.<br><b>2.</b> Vyber, kam se dívá.</p>
    <div class="smery" id="o"></div><div class="ovladani"><button class="tl" id="kontrola" disabled>Zkontrolovat ✔</button></div><div id="k"></div></div></div>`;
  const g = vytvorMrizku(u,{klik:true}); obsah.querySelector('#m').appendChild(g.el);
  const radek = radekProgramu(u.program); obsah.querySelector('#r').appendChild(radek);
  radek.querySelectorAll('.cmd').forEach((c,i)=>{ if(i===u.po-1) c.classList.add('po-n'); if(i>=u.po) c.classList.add('ztlumeny'); });
  const kr = krokovani(g, ()=>prikazy(u.program).slice(0,u.po).join(''), radek, obsah.querySelector('#k'));
  const tl = obsah.querySelector('#kontrola'), smerTl = smerTlacitka(obsah.querySelector('#o'));
  const aktualizuj = () => { tl.disabled = !(pole && smer); };
  g.mrizka.querySelectorAll('.bunka.klik').forEach(b => b.onclick = () => { if(hotovo||zaneprazdneno) return;
    g.mrizka.querySelectorAll('.bunka').forEach(x=>x.classList.remove('vybrana','spatna')); b.classList.add('vybrana'); pole=[+b.dataset.r,+b.dataset.c]; aktualizuj(); });
  smerTl.forEach(b => b.onclick = () => { if(hotovo||zaneprazdneno) return; smerTl.forEach(x=>x.classList.remove('vybrany','spatne')); b.classList.add('vybrany'); smer=b.dataset.s; aktualizuj(); });
  const ukazReseni = async () => { kr.skryj(); g.mrizka.querySelectorAll('.bunka').forEach(x=>x.classList.remove('vybrana','spatna'));
    await prehraj(g,u.program,radek,u.po); g.bunka(...sp.pole).classList.add('spravna');
    smerTl.forEach(x=>{ x.classList.remove('vybrany','spatne'); if(x.dataset.s===sp.smer) x.classList.add('spravne'); }); };
  tl.onclick = async () => {
    if (hotovo||zaneprazdneno) return;
    const okPole=stejne(pole,sp.pole), okSmer=smer===sp.smer;
    if (okPole && okSmer){ hotovo=true; tl.disabled=true; await ukazReseni(); ctx.hotovo(pochvala()+`<p>Po ${u.po}. příkazu robot stojí na zeleném políčku a dívá se <b>${SLOVO[sp.smer]}</b>.</p>`); return; }
    pokusy++; ctx.chyba();
    if (pokusy===1){
      const t = okPole ? 'Políčko máš správně. Kam se ale robot dívá? Hlídej každé otočení.' : okSmer ? 'Směr máš správně, ale políčko ne. Spočítej kroky vpřed.' : 'Políčko ani směr nesedí. Projdi program po jednom příkazu.';
      ctx.zprava('rada', `<p><b>Ještě jednou.</b> ${t} Pomůže ti tlačítko <b>Krok ▶</b>. Zastav se po ${u.po}. příkazu.</p><p>Co je červeně, oprav, a pak znovu klepni na <b>Zkontrolovat ✔</b>.</p>`); kr.ukaz();
      if (!okPole) g.mrizka.querySelectorAll('.bunka.vybrana').forEach(x=>{x.classList.remove('vybrana');x.classList.add('spatna');});
      if (!okSmer) smerTl.forEach(x=>{ if(x.classList.contains('vybrany')){x.classList.remove('vybrany');x.classList.add('spatne');} });
    } else { hotovo=true; tl.disabled=true; await ukazReseni();
      ctx.hotovo(`<p><b>Podívej se, kudy robot šel.</b> Po ${u.po}. příkazu stojí na zeleném políčku a dívá se <b>${SLOVO[sp.smer]}</b>.</p>`); }
  };
}

// --- kde sedí brouk ---
function ulohaBrouk(ctx){
  const {m, u, obsah} = ctx; const a = odpoved(m,u); let pokusy=0, faze=0, hotovo=false;
  obsah.innerHTML = `<p class="zadani" id="zad">Robot má dojít ke hvězdičce ★. Klepni na <b>Spustit program</b> a sleduj ho.</p>${u.poznamka?`<p>📄 ${esc(u.poznamka)}</p>`:''}${pravidlaHTML()}
    <div class="uloha-layout"><div id="m"></div><div><p style="margin:0 0 6px">Robot se na začátku dívá <b>${SLOVO[u.smer]}</b>.</p><b>Chybný program:</b><div id="r"></div>
    <div class="ovladani"><button class="tl" id="spust">Spustit program ▶</button></div><div id="k"></div></div></div>`;
  const g = vytvorMrizku(u); obsah.querySelector('#m').appendChild(g.el);
  const radek = radekProgramu(u.program,{klik:true}); obsah.querySelector('#r').appendChild(radek);
  const chips = radek.querySelectorAll('.cmd'), zad = obsah.querySelector('#zad'), tl = obsah.querySelector('#spust');
  const kr = krokovani(g, ()=>u.program, radek, obsah.querySelector('#k'));
  tl.onclick = async () => {
    if (zaneprazdneno) return; await prehraj(g, u.program, radek);
    if (a.projev>=0) znacka(chips[a.projev],'⚡');
    if (faze===0){ faze=1; tl.textContent='Spustit znovu ⟲'; zad.innerHTML='Klepni na příkaz, kde sedí 🐞 brouk, tedy kde chyba <b>vznikla</b>.';
      ctx.zprava('info', `<p>${popisProjevu(a)} ${a.projev>=0?'Ten příkaz má značku ⚡.':''}</p><p>Brouk ale nemusí sedět tam, kde se chyba projevila.</p>`); }
  };
  chips.forEach((c,i) => c.onclick = async () => {
    if (faze!==1 || hotovo || zaneprazdneno) return;
    if (i===a.brouk){ hotovo=true; znacka(c,'🐞'); kr.skryj();
      ctx.hotovo(pochvala()+`<p>${popisBrouka(u,a)}</p>${a.projev>=0 && a.projev!==a.brouk ? `<p>Chyba vznikla u ${a.brouk+1}. příkazu, ale projevila se až u ${a.projev+1}. příkazu.</p>`:''}`); return; }
    pokusy++; ctx.chyba(); c.classList.add('bum'); setTimeout(()=>c.classList.remove('bum'),900);
    if (pokusy===1){ ctx.zprava('rada', `<p><b>Tady brouk nesedí.</b> ${radaKeKliku(i,a)}</p><p>Pomůže ti tlačítko <b>Krok ▶</b>.</p>`); kr.ukaz(); }
    else { hotovo=true; kr.skryj(); znacka(chips[a.brouk],'🐞');
      ctx.hotovo(`<p><b>Brouk je označený 🐞.</b> ${popisBrouka(u,a)}</p>`); }
  });
}

// --- oprav a ověř (a velký lov) ---
function ulohaOprava(ctx){
  const {m, u, obsah} = ctx; const a = odpoved(m,u); const lov = m.typ==='lov';
  let program = prikazy(u.program), vybrany = null, zmena = null, pokusy = 0, faze = lov?0:1, hotovo = false;
  obsah.innerHTML = `<p class="zadani" id="zad"></p>${u.poznamka?`<p>📄 ${esc(u.poznamka)}</p>`:''}${pravidlaHTML()}
    <div class="uloha-layout"><div id="m"></div><div><p style="margin:0 0 6px">Robot se na začátku dívá <b>${SLOVO[u.smer]}</b>.</p>
    ${lov?'<p class="krok-ladeni" id="kroky"></p>':''}<b>Program:</b><div id="r"></div>
    <div class="ovladani"><button class="tl druhe" id="spust">Spustit chybný program ▶</button></div>
    <div class="moznosti" id="otazka"></div><div class="nahrada skryte" id="nahrada"></div>
    <div class="ovladani"><button class="tl" id="over" disabled>Ověřit od STARTU ✔</button></div><div id="k"></div></div></div>`;
  const g = vytvorMrizku(u); obsah.querySelector('#m').appendChild(g.el);
  const radek = radekProgramu(u.program,{klik:true}); obsah.querySelector('#r').appendChild(radek);
  const chips = radek.querySelectorAll('.cmd'), zad = obsah.querySelector('#zad'), tlSpust = obsah.querySelector('#spust'), tlOver = obsah.querySelector('#over'), nahrada = obsah.querySelector('#nahrada');
  const kr = krokovani(g, ()=>program.join(''), radek, obsah.querySelector('#k'));
  const kroky = obsah.querySelector('#kroky');
  const ukazKroky = () => { if(!kroky) return; const t=['1. Proveď program','2. Co se stalo?','3. Najdi a oprav brouka','4. Ověř od STARTU']; kroky.innerHTML = t.map((x,i)=> i===faze ? `<b>▶ ${x}</b>` : x).join(' • '); };
  const nastavZadani = () => {
    if (faze===0) zad.innerHTML = 'Velký lov! Nejdřív spusť chybný program a sleduj robota.';
    else if (faze===1) zad.innerHTML = lov ? 'Co se stalo? Vyber správnou odpověď.' : 'Najdi příkaz s broukem, klepni na něj a vyber, čím ho nahradíš. Pak klepni na <b>Ověřit od STARTU</b>.';
    else zad.innerHTML = 'Klepni na příkaz s broukem a vyber, čím ho nahradíš. Pak klepni na <b>Ověřit od STARTU</b>.';
    ukazKroky();
  };
  if (lov){ faze=0; } nastavZadani();
  const opravovani = () => (!lov && faze===1) || (lov && faze===2);
  tlSpust.onclick = async () => {
    if (zaneprazdneno || hotovo) return;
    vratZmenu(); await prehraj(g, u.program, radek);
    if (lov && faze<=1){ chips.forEach(c=>c.classList.remove('prosel','bum')); g.mrizka.querySelectorAll('.blesk').forEach(x=>x.remove()); }
    else if (a.projev>=0) znacka(chips[a.projev],'⚡');
    if (lov && faze===0){ faze=1; nastavZadani(); ukazOtazku(); }
  };
  function ukazOtazku(){
    const box = obsah.querySelector('#otazka'); const n = program.length;
    let volby;
    if (a.projev>=0){ const jine = a.brouk!==a.projev ? a.brouk : (a.projev>0?a.projev-1:a.projev+1);
      volby = [[1,`Robot narazil při ${a.projev+1}. příkazu.`],[0,`Robot narazil při ${jine+1}. příkazu.`],[0,'Robot nenarazil, ale skončil jinde než ve hvězdičce.']]; }
    else volby = [[1,'Robot nenarazil, ale skončil jinde než ve hvězdičce.'],[0,`Robot narazil při ${n}. příkazu.`],[0,'Robot došel ke hvězdičce.']];
    let pk = 0;
    zamichej(volby).forEach(([ok,t]) => { const b=document.createElement('button'); b.className='moznost'; b.textContent=t; b.dataset.ok=ok;
      b.onclick = () => { if (zaneprazdneno) return;
        if (ok){ b.classList.add('spravne'); box.querySelectorAll('button').forEach(x=>x.disabled=true);
          if (a.projev>=0) znacka(chips[a.projev],'⚡');
          ctx.zprava('info', `<p><b>Správně.</b> ${popisProjevu(a)} ${a.projev>=0?'Ten příkaz má teď značku ⚡. ':''}Teď najdi, kde chyba <b>vznikla</b>.</p>`);
          setTimeout(()=>{ box.innerHTML=''; faze=2; nastavZadani(); }, 900); return; }
        pk++; ctx.chyba(); b.classList.add('spatne'); b.disabled=true;
        ctx.zprava('rada', `<p><b>Ještě jednou.</b> Spusť program znovu a sleduj, který příkaz se právě rozsvítí, když robot narazí. Pomůže ti i <b>Krok ▶</b>.</p>`); kr.ukaz();
        if (pk>=2){ box.querySelectorAll('button').forEach(x=>{ x.disabled=true; if(x.dataset.ok==='1') x.classList.add('spravne'); });
          if (a.projev>=0) znacka(chips[a.projev],'⚡'); ctx.zprava('reseni', `<p>${popisProjevu(a)} Teď najdi, kde chyba <b>vznikla</b>.</p>`); setTimeout(()=>{ box.innerHTML=''; faze=2; nastavZadani(); }, 1600); }
      }; box.appendChild(b); });
  }
  function vratZmenu(){ if (zmena){ program[zmena.i] = zmena.puvodni; nastavChip(chips[zmena.i], zmena.puvodni); chips[zmena.i].classList.remove('zmeneny'); zmena=null; } tlOver.disabled=true; }
  chips.forEach((c,i) => c.onclick = () => {
    if (hotovo || zaneprazdneno || !opravovani()) return;
    vratZmenu(); chips.forEach(x=>x.classList.remove('vybrany')); c.classList.add('vybrany'); vybrany=i;
    nahrada.classList.remove('skryte');
    nahrada.innerHTML = `<b>Čím nahradíš ${i+1}. příkaz?</b><div class="pad">${['↶','↑','↷'].map(ch=>`<button class="cmd ${PRIKAZ[ch].tr}" data-s="${ch}" ${ch===u.program[i]||ch===prikazy(u.program)[i]?'disabled':''}>${ch}<small>${PRIKAZ[ch].slovo}</small></button>`).join('')}</div>`;
    nahrada.querySelectorAll('button').forEach(b => b.onclick = () => {
      if (zaneprazdneno) return; const puvodni = prikazy(u.program)[i];
      vratZmenu(); program[i] = b.dataset.s; zmena = {i, puvodni}; nastavChip(c, b.dataset.s); c.classList.add('zmeneny'); c.classList.remove('vybrany');
      nahrada.classList.add('skryte'); tlOver.disabled=false; g.resetRobota();
    });
  });
  tlOver.onclick = async () => {
    if (hotovo || zaneprazdneno || !zmena) return;
    chips.forEach(c=>znacka(c,null)); const ok = await prehraj(g, program.join(''), radek, null, '#2E8B57') && dojde(u, program.join(''));
    if (ok){ hotovo=true; faze=3; ukazKroky(); znacka(chips[zmena.i],'🐞'); kr.skryj(); tlSpust.disabled=true;
      ctx.hotovo(pochvala()+`<p>${popisBrouka(u,a)} Opravený program jsme ověřili od STARTU a robot došel ke hvězdičce.</p>`); return; }
    pokusy++; ctx.chyba();
    const s = simuluj(u, program.join('')); const co = s.stop>=0 ? `Robot pořád narazil, tentokrát při ${s.stop+1}. příkazu.` : 'Robot pořád nedošel ke hvězdičce.';
    const rada = zmena.i===a.brouk ? 'Příkaz jsi našel(našla) správně, ale tahle náhrada nefunguje. Zkus jinou.' : radaKeKliku(zmena.i,a);
    if (pokusy===1){ ctx.zprava('rada', `<p><b>Ještě to nefunguje.</b> ${co}</p><p>${rada}</p><p>Klepni na příkaz a vyber jinou opravu. Pomůže ti i <b>Krok ▶</b>.</p>`); kr.ukaz(); }
    else { hotovo=true; kr.skryj(); vratZmenu(); program[a.brouk]=a.nahrada; nastavChip(chips[a.brouk], a.nahrada); chips[a.brouk].classList.add('zmeneny'); znacka(chips[a.brouk],'🐞');
      await prehraj(g, program.join(''), radek, null, '#2E8B57'); tlSpust.disabled=true;
      ctx.hotovo(`<p><b>Podívej se na správnou opravu.</b> ${popisBrouka(u,a)}</p>`); }
  };
}

// ---------- konec mise, diplom ----------
function dokonciMisi(mi){
  const m = HRA.mise[mi], p = S.pozice[m.id];
  const podil = p.ok/m.ulohy.length, h = podil>=0.85?3:podil>=0.6?2:1;
  const pred = S.hotovo[m.id]; S.hotovo[m.id] = {hvezdy: Math.max(h, pred?pred.hvezdy:0)}; S.pozice[m.id] = {i:0, ok:0}; uloz();
  const posledni = HRA.mise.every(x=>S.hotovo[x.id]);
  $app.innerHTML = hlavicka(esc(m.nazev)) + `<div class="karta odmena"><div style="width:120px;margin:0 auto">${broukSVG(m.brouk)}</div>
    <h2>Chytil(a) jsi brouka: ${NAZVY_BROUKU[m.brouk]}!</h2><div class="hvezdy">${hvezdy(h)}</div>
    <p>Napoprvé správně: ${p.ok} z ${m.ulohy.length}</p><p style="font-size:1.05rem">${esc(m.zaverMise)}</p>
    <div class="ovladani" style="justify-content:center"><button class="tl" id="zpet">${posledni?'Podívat se na celou sbírku 🔍':'Zpět ke sbírce ▶'}</button></div></div>`;
  navazHlavicku(); document.getElementById('zpet').onclick = sbirka;
}
function diplom(){
  const d = new Date().toLocaleDateString('cs-CZ');
  const celkem = HRA.mise.reduce((a,m)=>a+(S.hotovo[m.id]?S.hotovo[m.id].hvezdy:0),0);
  $app.innerHTML = hlavicka('Diplom') + `<div class="diplom">
    <h2>${esc(HRA.diplom.nadpis)}</h2><p style="font-size:1.2rem;margin:0">${esc(HRA.nazev)}</p>
    <div class="jmeno">${esc(S.jmeno)}</div><p style="font-size:1.3rem;font-weight:bold;color:var(--tmava)">${esc(HRA.diplom.titul)}</p>
    <div class="brouci">${HRA.mise.map(m=>broukSVG(m.brouk)).join('')}</div>
    <p style="max-width:640px;margin:0 auto">${esc(S.jmeno)} ${esc(HRA.diplom.text)}</p>
    <p class="hvezdy" style="font-size:1.4rem;margin-top:10px">★ ${celkem} z ${HRA.mise.length*3} hvězd</p>
    <div class="podpisy"><div><div class="cara">${d}</div>datum</div><div><div class="cara">${esc(HRA.autor)}</div>Informatika, 4. třída</div></div>
    <p style="font-size:.7rem;color:#7b8a84;margin-top:14px">CZŠ Kroměříž • ${esc(HRA.autor)} (vytvořeno pomocí AI)</p></div>
    <div class="ovladani neprint" style="justify-content:center"><button class="tl" id="tisk">🖨️ Vytisknout</button><button class="tl druhe" id="zpet">Zpět ke sbírce</button></div>`;
  navazHlavicku();
  document.getElementById('tisk').onclick = () => window.print();
  document.getElementById('zpet').onclick = sbirka;
}

// ---------- start ----------
document.documentElement.classList.toggle('velke', !!S.velke);
zkontrolujData();
uvod();
</script>
